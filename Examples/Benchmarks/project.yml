name: Benchmarks
options:
  bundleIdPrefix: dev.wildedge.sample
  deploymentTarget:
    iOS: "16.0"
schemes:
  Benchmarks:
    build:
      targets:
        Benchmarks: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
packages:
  WildEdge:
    path: ../..
targets:
  Benchmarks:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildedge.sample.benchmarks
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: WildEdge
        product: WildEdgeBenchmarks
