name: llamaExample
options:
  bundleIdPrefix: dev.wildedge.example
  deploymentTarget:
    iOS: "16.0"
packages:
  LlamaPackage:
    path: LlamaPackage
  WildEdge:
    path: ../..
targets:
  llamaExample:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: LlamaPackage
        product: llama
      - package: WildEdge
        product: WildEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wildedge.example.llamaexample
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
