<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="combined-title combined-desc">
  <title id="combined-title">Whisper Tiny plus text-to-tool latency</title>
  <desc id="combined-desc">Horizontal stacked bar chart showing OpenAI Whisper Tiny plus text-to-tool median duration, sorted fastest to slowest. Whisper Tiny plus LFM2 350M is fastest at 341.5 milliseconds, and Whisper Tiny plus FunctionGemma is slowest at 1352.5 milliseconds.</desc>
  <rect width="720" height="360" rx="18" fill="#ffffff"/>

  <image href="wildedge-logo-text.svg" x="34" y="22" width="64" height="45" preserveAspectRatio="xMinYMin meet"/>
  <text x="122" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#102a43">Whisper Tiny + text-to-tool latency</text>
  <text x="122" y="65" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Stacked STT + LLM stage medians, sorted fastest to slowest.</text>

  <rect x="478" y="31" width="12" height="12" rx="2" fill="#024079"/>
  <text x="496" y="41" font-family="Arial, sans-serif" font-size="12" fill="#52606d">STT</text>
  <rect x="540" y="31" width="12" height="12" rx="2" fill="#00b78b"/>
  <text x="558" y="41" font-family="Arial, sans-serif" font-size="12" fill="#52606d">LLM</text>

  <line x1="206" y1="300" x2="626" y2="300" stroke="#d9e2ec" stroke-width="1.5"/>
  <line x1="206" y1="88" x2="206" y2="300" stroke="#d9e2ec" stroke-width="1.5"/>
  <line x1="346" y1="88" x2="346" y2="300" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="486" y1="88" x2="486" y2="300" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="626" y1="88" x2="626" y2="300" stroke="#f0f4f8" stroke-width="1"/>
  <text x="206" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">0</text>
  <text x="346" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">500</text>
  <text x="486" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">1000</text>
  <text x="626" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">1500 ms</text>

  <text x="190" y="112" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">Whisper + LFM2</text>
  <rect x="206" y="98" width="24.36" height="22" rx="5" fill="#024079"/>
  <rect x="230.36" y="98" width="71.26" height="22" rx="5" fill="#00b78b"/>
  <text x="316" y="114" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">341.5 ms</text>

  <text x="190" y="162" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">Whisper + Qwen3</text>
  <rect x="206" y="148" width="24.36" height="22" rx="5" fill="#024079"/>
  <rect x="230.36" y="148" width="137.2" height="22" rx="5" fill="#00b78b"/>
  <text x="382" y="164" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">577 ms</text>

  <text x="190" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">Whisper + TinyLlama</text>
  <rect x="206" y="198" width="24.36" height="22" rx="5" fill="#024079"/>
  <rect x="230.36" y="198" width="264.88" height="22" rx="5" fill="#00b78b"/>
  <text x="509" y="214" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">1033 ms</text>

  <text x="190" y="262" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">Whisper + FunctionGemma</text>
  <rect x="206" y="248" width="24.36" height="22" rx="5" fill="#024079"/>
  <rect x="230.36" y="248" width="354.34" height="22" rx="5" fill="#00b78b"/>
  <text x="598" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">1352.5 ms</text>

  <text x="416" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Median duration (ms)</text>
</svg>
