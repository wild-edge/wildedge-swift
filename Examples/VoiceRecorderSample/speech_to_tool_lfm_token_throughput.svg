<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="throughput-title throughput-desc">
  <title id="throughput-title">LeapSDK-reported token throughput</title>
  <desc id="throughput-desc">Bar chart comparing LeapSDK-reported token throughput for Leap LFM2.5 Audio 1.5B speech-to-tool across iPhone generations: iPhone 11 at 0.94 tokens per second, iPhone 13 mini at 6.82, iPhone 13 Pro Max at 11.91, and iPhone 16 Pro at 15.21.</desc>
  <rect width="720" height="330" rx="18" fill="#ffffff"/>

  <image href="wildedge-logo-text.svg" x="42" y="24" width="76" height="53" preserveAspectRatio="xMinYMin meet"/>
  <text x="164" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#102a43">LeapSDK-reported token throughput</text>
  <text x="164" y="66" font-family="Arial, sans-serif" font-size="12" fill="#52606d">Reported as GenerationStats.tokenPerSecond</text>

  <line x1="92" y1="248" x2="672" y2="248" stroke="#d9e2ec" stroke-width="1.5"/>
  <line x1="92" y1="88" x2="92" y2="248" stroke="#d9e2ec" stroke-width="1.5"/>

  <line x1="92" y1="208" x2="672" y2="208" stroke="#f0f4f8" stroke-width="1"/>
  <text x="80" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">4</text>
  <line x1="92" y1="168" x2="672" y2="168" stroke="#f0f4f8" stroke-width="1"/>
  <text x="80" y="172" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">8</text>
  <line x1="92" y1="128" x2="672" y2="128" stroke="#f0f4f8" stroke-width="1"/>
  <text x="80" y="132" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">12</text>
  <line x1="92" y1="88" x2="672" y2="88" stroke="#f0f4f8" stroke-width="1"/>
  <text x="80" y="92" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#829ab1">16</text>

  <rect x="117" y="238.57" width="86" height="9.43" rx="5" fill="#333333"/>
  <text x="160" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#333333">0.94</text>
  <text x="160" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">iPhone 11</text>
  <text x="160" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#52606d">iPhone12,1</text>

  <rect x="267" y="179.83" width="86" height="68.17" rx="9" fill="#333333"/>
  <text x="310" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">6.82</text>
  <text x="310" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">iPhone 13 mini</text>
  <text x="310" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#52606d">iPhone14,4</text>

  <rect x="417" y="128.88" width="86" height="119.12" rx="10" fill="#333333"/>
  <text x="460" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">11.91</text>
  <text x="460" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">iPhone 13 Pro Max</text>
  <text x="460" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#52606d">iPhone14,3</text>

  <rect x="567" y="95.92" width="86" height="152.08" rx="10" fill="#333333"/>
  <text x="610" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">15.21</text>
  <text x="610" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#102a43">iPhone 16 Pro</text>
  <text x="610" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#52606d">iPhone17,1</text>

  <text x="24" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#52606d" transform="rotate(-90 24 168)">Tokens per second</text>
  <text x="48" y="318" font-family="Arial, sans-serif" font-size="12" fill="#52606d">SDK field does not document whether this counts generated tokens only or input plus output.</text>
</svg>
